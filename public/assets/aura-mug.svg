<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="mugTitle mugDesc">
  <title id="mugTitle">Aura Mug</title>
  <desc id="mugDesc">A terracotta hand-glazed stoneware mug with a soft cream rim and a rounded handle.</desc>

  <defs>
    <linearGradient id="bodyGrad" x1="0.12" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d07f55"/>
      <stop offset="0.42" stop-color="#b4552d"/>
      <stop offset="1" stop-color="#8a3b1d"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c06a42"/>
      <stop offset="1" stop-color="#8c3e1f"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="0.55" stop-color="#f0dcc7"/>
      <stop offset="1" stop-color="#d8b294"/>
    </linearGradient>
    <radialGradient id="innerGrad" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#5a3220"/>
      <stop offset="0.7" stop-color="#3b2114"/>
      <stop offset="1" stop-color="#25140c"/>
    </radialGradient>
    <pattern id="speckle" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1.1" fill="#5b2a15" opacity="0.26"/>
      <circle cx="8" cy="8" r="0.8" fill="#5b2a15" opacity="0.18"/>
      <circle cx="5" cy="10" r="0.6" fill="#fff5e8" opacity="0.16"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M 172 204 L 203 480 C 206 505 222 520 248 520 L 392 520 C 418 520 434 505 437 480 L 468 204 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="322" cy="558" rx="176" ry="26" fill="#5a3218" opacity="0.18" filter="url(#softShadow)"/>

  <path d="M 448 252 C 540 242 584 302 560 360 C 540 408 492 424 436 414" fill="none" stroke="url(#handleGrad)" stroke-width="40" stroke-linecap="round"/>
  <path d="M 448 252 C 540 242 584 302 560 360 C 540 408 492 424 436 414" fill="none" stroke="#e39a72" stroke-width="7" stroke-linecap="round" opacity="0.32"/>

  <path d="M 172 204 L 203 480 C 206 505 222 520 248 520 L 392 520 C 418 520 434 505 437 480 L 468 204 Z" fill="url(#bodyGrad)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="150" y="180" width="340" height="360" fill="url(#speckle)"/>
    <path d="M 214 232 C 204 320 208 430 232 500" fill="none" stroke="#ffe4cd" stroke-width="30" stroke-linecap="round" opacity="0.13"/>
    <path d="M 420 240 C 428 330 424 430 406 492" fill="none" stroke="#4f2110" stroke-width="26" stroke-linecap="round" opacity="0.12"/>
  </g>

  <ellipse cx="320" cy="204" rx="148" ry="42" fill="url(#rimGrad)"/>
  <ellipse cx="320" cy="208" rx="123" ry="32" fill="url(#innerGrad)"/>
  <ellipse cx="320" cy="214" rx="104" ry="22" fill="#2b170e" opacity="0.85"/>
  <path d="M 200 208 A 120 31 0 0 0 440 208" fill="none" stroke="#f6e5d2" stroke-width="5" opacity="0.26"/>
  <path d="M 196 184 A 148 42 0 0 1 300 164" fill="none" stroke="#fffaf2" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <text x="320" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="9" fill="#f7e8d9" opacity="0.8">AURA</text>
  <text x="320" y="488" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#f7e8d9" opacity="0.45">350 ML</text>

  <g fill="none" stroke="#b4552d" stroke-linecap="round" opacity="0.2">
    <path d="M 272 146 C 256 122 286 110 272 82" stroke-width="5"/>
    <path d="M 320 138 C 304 112 334 100 320 70" stroke-width="5"/>
    <path d="M 368 146 C 352 122 382 110 368 82" stroke-width="5"/>
  </g>
</svg>
